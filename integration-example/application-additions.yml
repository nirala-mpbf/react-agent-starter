# MERGE into the existing application's application.yml.
# Keep its existing database, Redis, lakeFS, prompt, and gateway settings.
mcp:
  brain:
    url: ${BRAIN_MCP_URL:http://localhost:4000/mcp}

react-agent:
  prompts:
    enabled: true
    controller-enabled: true # Enable only when the host protects the prompt administration endpoints.
  mcp:
    timeout: 30s
  # Execution approvals are independent of the annotation's visibility filter.
  permissions:
    allow:
      - get_current_status
      - verify_otp
      - submit_profile
      - submit_account_statement
      - submit_udyam_document


# Merge with the existing spring.flyway block. Keep existing locations/history/baseline settings.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/react-agent-sdk

# Keep the existing spring.datasource.*, spring.data.redis.*, lakefs.* and prompt.cache.ttl properties.
# Required lakefs properties: endpoint, access-key, secret-key, repository, branch.
